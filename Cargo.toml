[package]
name = "downer"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "A small FFmpeg-backed media downloader"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
percent-encoding = "2.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "brotli", "deflate", "gzip", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `build.rs` reads extension/manifest.json for the add-on ID; serde_json is
# already a runtime dependency, so this adds no new crate to the lockfile.
[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
