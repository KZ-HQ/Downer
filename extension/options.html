<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Downer settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Downer settings</h1>
    <label>
      Output directory (optional)
      <input id="output-dir" type="text" placeholder="Defaults to your Downloads folder">
    </label>
    <label>
      FFmpeg processing threads (optional)
      <input id="ffmpeg-threads" type="number" min="1" step="1" placeholder="Auto">
    </label>
    <p class="hint">Leave blank to let FFmpeg choose. This affects processing, not parallel HLS segment requests.</p>
    <button id="save">Save</button>
    <p id="status"></p>
    <section aria-labelledby="logs-heading">
      <div class="logs-header">
        <h2 id="logs-heading">Live FFmpeg logs</h2>
        <div>
          <label for="job-filter">Download</label>
          <select id="job-filter">
            <option value="all">All downloads</option>
          </select>
          <button id="clear-logs" type="button">Clear logs</button>
        </div>
      </div>
      <pre id="logs" aria-live="polite">No FFmpeg logs yet.</pre>
    </section>
  </main>
  <script src="redact.js"></script>
  <script src="job-logs.js"></script>
  <script src="options.js"></script>
</body>
</html>
