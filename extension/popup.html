<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Downer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Downer</h1>
    <p id="status">Scanning this page…</p>
    <ul id="media-list"></ul>
    <details id="other-candidates" hidden>
      <summary id="other-candidates-summary"></summary>
      <ul id="other-media-list"></ul>
    </details>
    <p id="setup-warning" class="setup-warning" hidden></p>
    <p id="help" class="muted">Open a page with a video player, then open Downer again.</p>
    <p id="download-status" class="download-status" aria-live="polite"></p>
    <a href="options.html" target="_blank">Settings</a>
  </main>
  <script src="job-state.js"></script>
  <script src="job-view.js"></script>
  <!-- candidate-view.js reads CONFIDENCE from media-scan.js, so that loads first. -->
  <script src="media-scan.js"></script>
  <script src="candidate-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
